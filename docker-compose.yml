services:
  db:
    image: postgres:16-alpine
    container_name: vortex-metrics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vortex_metrics
    ports:
      - "5434:5432"
    volumes:
      - vortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vortex_metrics"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:4
    container_name: vortex-metrics-adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  vortex_pgdata:
